name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: api/package-lock.json
      - name: Install dependencies
        run: npm ci --prefer-offline
        working-directory: api
      - name: Run lint
        run: npm run lint
        working-directory: api

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: api/package-lock.json
      - name: Install dependencies
        run: npm ci --prefer-offline
        working-directory: api
      - name: Wait for Mongo
        run: sleep 10
      - name: Run tests
        run: npm test
        working-directory: api
        env:
          NODE_ENV: test
          CONNECTION_STRING: mongodb://localhost:27017/test
          JWT_SECRET: test-secret-key-min-32-characters-long
          TOKEN_EXPIRE_TIME: 86400
          FILE_UPLOAD_PATH: /tmp/
          DEFAULT_LANG: EN
          ALLOWED_ORIGINS: http://localhost:3000
          SENDGRID_API_KEY: test_key
          SENDGRID_FROM_EMAIL: test@test.com
          APP_URL: http://localhost:3000
          UPSTASH_REDIS_REST_URL: http://localhost:6379
          UPSTASH_REDIS_REST_TOKEN: test_token
          REDIS_URL: redis://localhost:6379
      - name: Build Docker image
        run: docker build -t backend-project-base .
        working-directory: api
